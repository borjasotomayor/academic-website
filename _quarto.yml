    left:   # You can comment out all navigation items here if you just like to keep the index page only
#      - text: Home
#        href: index.qmd
      - text: About me
        href: about.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Other Activities
        href: other.qmd
      - text: T-Shirts
        href: tshirts.qmd
      - text: Contact
        href: contact.qmd       

    right: 
      - icon: github
        href: https://github.com/borjasotomayor
      - icon: linkedin
        href: https://www.linkedin.com/in/borja-sotomayor/
        target: _blank
      - text: "{{< ai google-scholar >}}"
        href: http://bit.ly/google-scholar-borja
